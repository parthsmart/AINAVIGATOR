name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Generate OpenAPI TypeScript schema
        run: npm run generate:types
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit, component & axe accessibility tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Enforce bundle size performance budgets
        run: npm run check:bundle
